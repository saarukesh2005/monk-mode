name: Android

# Unit tests plus debug APK, release APK and App Bundle. Release builds are unsigned unless the
# MONK_KEYSTORE* secrets are configured (see docs/BUILD_GUIDE.md); never commit a keystore.
on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'packages/database/**', 'packages/shared-core/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'packages/database/**', 'packages/shared-core/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Build debug APK, release APK and bundle
        env:
          MONK_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: monk-mode-android
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/outputs/bundle/**/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: apps/android/**/build/reports/tests/

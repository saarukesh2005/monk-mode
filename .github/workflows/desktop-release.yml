name: Desktop builds

# Produces installable, UNSIGNED desktop builds. Signing needs your own Apple Developer ID and a
# Windows code-signing certificate; see docs/BUILD_GUIDE.md. Run manually, or push a v* tag to
# also publish a GitHub Release with the desktop installers and browser extensions attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build
        working-directory: apps/desktop
        env:
          MONK_BUILD_NUMBER: ${{ github.run_number }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/${{ matrix.target }}/release/monk-mode.exe" "portable/MONK MODE portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: monk-mode-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            portable/*.exe

  extensions:
    name: Browser extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-extensions.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, extensions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect release files
        run: |
          mkdir -p release
          # Give each desktop file a clear, unique name.
          find dist/monk-mode-aarch64-apple-darwin -name '*.dmg' -exec cp {} "release/MONK-MODE-${GITHUB_REF_NAME}-macOS-AppleSilicon.dmg" \;
          find dist/monk-mode-x86_64-apple-darwin -name '*.dmg' -exec cp {} "release/MONK-MODE-${GITHUB_REF_NAME}-macOS-Intel.dmg" \;
          find dist/monk-mode-x86_64-pc-windows-msvc -name '*-setup.exe' -exec cp {} "release/MONK-MODE-${GITHUB_REF_NAME}-Windows-Setup.exe" \;
          find dist/monk-mode-x86_64-pc-windows-msvc -name '*.msi' -exec cp {} "release/MONK-MODE-${GITHUB_REF_NAME}-Windows.msi" \;
          find dist/monk-mode-x86_64-pc-windows-msvc -name '*portable.exe' -exec cp {} "release/MONK-MODE-${GITHUB_REF_NAME}-Windows-Portable.exe" \;
          cp dist/browser-extensions/*.zip release/
          (cd release && sha256sum * > SHA256SUMS-desktop.txt)
          ls -la release
        shell: bash
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "MONK MODE ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md
          fi
